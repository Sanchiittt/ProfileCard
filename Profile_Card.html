<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sanchit Tete - Profile Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #e0f2f1, #f3e5f5);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      width: 330px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #6c63ff;
      margin-bottom: 15px;
      transition: transform 0.3s ease-in-out, box-shadow 0.3s ease;
    }

    .profile-img:hover {
      transform: scale(2.2);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
    }

    .name {
      font-size: 24px;
      font-weight: 600;
      color: #333;
      transition: color 0.3s ease;
    }

    .name:hover {
      color: #6c63ff;
    }

    .bio {
      font-size: 14px;
      color: #555;
      margin: 10px 0 15px;
      line-height: 1.5;
    }

    .toggle-btn {
      background-color: #26a69a;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.3s ease;
    }

    .toggle-btn:hover {
      background-color: #00796b;
    }

    .hobbies {
      list-style: none;
      padding: 0;
      margin: 15px 0;
      display: none;
    }

    .hobbies li {
      background-color: rgba(255, 255, 255, 0.5);
      padding: 6px 10px;
      border-radius: 10px;
      margin-bottom: 6px;
      font-size: 14px;
      transition: all 0.3s ease-in-out;
    }

    .hobbies li:hover {
      color: #333;
      background-color: #e0f7fa;
      box-shadow: 0 0 10px #8be0e7;
      transform: scale(1.05);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 15px;
    }

    .social-links a {
      color: #6c63ff;
      font-size: 22px;
      transition: transform 0.3s, color 0.3s;
    }

    .social-links a:hover {
      transform: scale(1.3);
      color: #000;
    }

    @media (max-width: 400px) {
      .card {
        width: 90%;
        padding: 25px;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <img class="profile-img" src="Profile.png" alt="Sanchit Tete" />
    
    <div class="name">Sanchit Tete</div>
   
    <p class="bio">Frontend enthusiast who loves gaming, building UI, and spending time with friends. Currently pursuing a degree in Computer Science.</p>

    <button class="toggle-btn" onclick="toggleHobbies()">Hobbies</button>
    <ul class="hobbies" id="hobbyList">
      <li>Gaming</li>
      <li>Traveling</li>
      <li>Sleeping</li>
    </ul>

    <div class="social-links">
      <a href="https://github.com/Sanchiittt/" target="_blank" title="GitHub">
        <i class="fab fa-github"></i>
      </a>
      <a href="https://www.instagram.com/sanchit_tete?igsh=azd2dHRya3Nzb2hp" target="_blank" title="Instagram">
        <i class="fab fa-instagram"></i>
      </a>
    </div>
  </div>

  <script>
    function toggleHobbies() {
      const list = document.getElementById('hobbyList');
      list.style.display = list.style.display === 'none' || list.style.display === '' ? 'block' : 'none';
    }
  </script>

</body>
</html>
